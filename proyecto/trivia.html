<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
 body{font-family: Arial; background:#f4f4f9; padding:20px;}
 .caja{background:white; max-width:600px; margin:auto; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
 h2{color:#2c3e50; text-align:center;}
 .pregunta{margin:20px 0; padding:15px; border:1px solid #ddd; border-radius:8px;}
 .pregunta p{font-weight:bold;}
 button{width:100%; padding:10px; margin:5px 0; border:none; border-radius:6px; cursor:pointer; background:#eee; text-align:left;}
 button:hover{background:#d6eaf8;}
 .correcta{background:#2ecc71 !important; color:white;}
 .incorrecta{background:#e74c3c !important; color:white;}
 #resultado{margin-top:20px; font-size:20px; font-weight:bold; text-align:center;}
</style>
</head>
<body id="fondo">
    <h2><i class="bi bi-award-fill"></i> TRIVIA: BEATO DIONISIO PAMPLONA POLO</h2>

<p>Cambiar fondo:</p>
<button onclick="cambiarColor('lightyellow')">Claro</button>
<button onclick="cambiarColor('lightblue')">Celeste</button>
<button onclick="cambiarColor('white')">Blanco</button>
<hr>

<p><b>1. ¿A qué orden religiosa perteneció?</b></p>
<button onclick="r1('A')">A) Jesuitas</button>
<button onclick="r1('B')">B) Escolapios</button>
<button onclick="r1('C')">C) Franciscanos</button>
<p id="texto1"></p>

<p><b>2. ¿A qué actividad se dedicó?</b></p>
<button onclick="r2('A')">A) Medicina</button>
<button onclick="r2('B')">B) Política</button>
<button onclick="r2('C')">C) Educación de niños</button>
<p id="texto2"></p>

<p><b>3. ¿Qué hizo el 24 de julio de 1936?</b></p>
<button onclick="r3('A')">A) Abandonó España</button>
<button onclick="r3('B')">B) Fue a la parroquia a proteger el Santísimo</button>
<button onclick="r3('C')">C) Se escondió en el colegio</button>
<p id="texto3"></p>

<p><b>4. ¿Por qué es mártir?</b></p>
<button onclick="r4('A')">A) Fundó Escuelas Pías</button>
<button onclick="r4('B')">B) Fue rector</button>
<button onclick="r4('C')">C) Murió por su fe en 1936</button>
<p id="texto4"></p>

<p><b>5. ¿Cuándo fue beatificado?</b></p>
<button onclick="r5('A')">A) 25 de julio de 1936</button>
<button onclick="r5('B')">B) 1 de octubre de 1995</button>
<button onclick="r5('C')">C) 22 de septiembre de 2001</button>
<p id="texto5"></p>

<hr>
<h3 id="puntaje">Puntaje: 0</h3>

<script>
let puntaje = 0; // Number

function cambiarColor(color){
 let body = document.getElementById("fondo");
 body.style.backgroundColor = color;
}

function r1(letra){
 let elemento = document.getElementById("texto1");
 if(letra == "B"){
  elemento.textContent = "¡Correcto! Era Escolapios";
  puntaje = puntaje + 1;
 } else {
  elemento.textContent = "Incorrecto. Era B) Escolapios";
 }
 document.getElementById("puntaje").textContent = "Puntaje: " + puntaje;
}

function r2(letra){
 let elemento = document.getElementById("texto2");
 if(letra == "C"){
  elemento.textContent = "¡Correcto!";
  puntaje = puntaje + 1;
 } else {
  elemento.textContent = "Incorrecto. Era C) Educación";
 }
 document.getElementById("puntaje").textContent = "Puntaje: " + puntaje;
}

function r3(letra){
 let elemento = document.getElementById("texto3");
 if(letra == "B"){
  elemento.textContent = "¡Correcto!";
  puntaje = puntaje + 1;
 } else {
  elemento.textContent = "Incorrecto";
 }
 document.getElementById("puntaje").textContent = "Puntaje: " + puntaje;
}

function r4(letra){
 let elemento = document.getElementById("texto4");
 if(letra == "C"){
  elemento.textContent = "¡Correcto!";
  puntaje = puntaje + 1;
 } else {
  elemento.textContent = "Incorrecto";
 }
 document.getElementById("puntaje").textContent = "Puntaje: " + puntaje;
}

function r5(letra){
 let elemento = document.getElementById("texto5");
 if(letra == "B"){
  elemento.textContent = "¡Correcto! Fue en 1995";
  puntaje = puntaje + 1;
 } else {
  elemento.textContent = "Incorrecto. Fue en 1995";
 }
 let total = document.getElementById("puntaje");
 total.textContent = "Puntaje final: " + puntaje + " - Tipo de dato: " + typeof puntaje;
}
</script>
</body>
</html>
